[package]
name = "zhmm-tauri"
version = "2.0.0-rc.5"
description = "账号小本本 · Account Jotter — 小本本系列首作，国密 SM3/SM4 + Argon2id 本地优先账号信息管理器（Tauri + Vue 3 + Rust）。前身 zhmm-tauri。"
authors = ["szgenle"]
edition = "2021"
license = "MIT"
repository = "https://github.com/szgenle/zhmm-tauri"
homepage = "https://github.com/szgenle/zhmm-tauri"
readme = "../README.md"
default-run = "zhmm-tauri"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zhmm_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zhmm-tauri"
path = "src/main.rs"

[[bin]]
name = "zhmm-cli"
path = "src/cli/main.rs"

# 系列品牌别名：accjot 与 zhmm-cli 完全等价，便于 Account Jotter 时代过渡
[[bin]]
name = "accjot"
path = "src/cli/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 加密与安全（RustCrypto 生态）
sm3 = "0.4"
sm4 = "0.5"
cbc = { version = "0.1", features = ["std"] }
hmac = "0.12"
digest = "0.10"
cipher = "0.4"
argon2 = "0.5"
bcrypt = "0.15"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
subtle = "2.6"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
url = "2"

# 数据与状态
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
thiserror = "1"

# 导入导出 Excel
calamine = "0.26"
rust_xlsxwriter = "0.79"

# CLI 专用
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"

